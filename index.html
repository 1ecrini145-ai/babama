<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canım Babama...</title>
    <style>
        :root {
            --bg-color: #1e1e24;
            --envelope-color: #ff4757;
            --envelope-inside: #e03d4c;
            --paper-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e1e24, #4a154b);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Zarf Kapsayıcısı */
        .envelope-wrapper {
            position: relative;
            width: 300px;
            height: 200px;
            background-color: var(--envelope-inside);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            cursor: pointer;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            transition: transform 0.5s;
        }

        /* Zarfın Ön Kanatları */
        .envelope-wrapper::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: 4;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-bottom: 100px solid var(--envelope-color);
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            pointer-events: none;
        }

        .envelope-wrapper::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: 4;
            border-left: 150px solid var(--envelope-color);
            border-top: 100px solid transparent;
            border-bottom: 100px solid transparent;
            border-bottom-left-radius: 10px;
            pointer-events: none;
        }

        .envelope-right {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: 4;
            border-right: 150px solid var(--envelope-color);
            border-top: 100px solid transparent;
            border-bottom: 100px solid transparent;
            border-bottom-right-radius: 10px;
            pointer-events: none;
        }

        /* Zarfın Üst Kapağı */
        .envelope-flap {
            position: absolute;
            top: 0; left: 0;
            width: 0; height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 100px solid var(--envelope-color);
            transform-origin: top;
            transition: transform 0.4s ease-in-out, z-index 0.2s;
            z-index: 5;
        }

        /* Tıklanınca Zarfın Açılma Animasyonları */
        .envelope-wrapper.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope-wrapper.open .letter {
            transform: translateY(-130px) scale(1.05);
            z-index: 3;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Zarfın İçindeki Mektup Kağıdı */
        .letter {
            position: absolute;
            bottom: 10px;
            left: 15px;
            width: 270px;
            height: 380px;
            background-color: var(--paper-color);
            border-radius: 8px;
            transition: transform 0.6s ease-in-out, z-index 0.6s;
            z-index: 2;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            color: #333;
        }

        /* Fotoğraf Stili */
        .father-photo {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--envelope-color);
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--envelope-color);
            margin: 5px 0;
            text-align: center;
        }

        p {
            font-size: 0.85rem;
            line-height: 1.4;
            color: #555;
            text-align: center;
            margin: 5px 0 0 0;
        }

        /* Tıklama İpucu */
        .hint {
            position: absolute;
            bottom: -40px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 0.9rem;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            to { transform: scale(1.05); opacity: 0.8; }
        }

        /* Arka plandaki uçan küçük kalpler */
        .bg-heart {
            position: absolute;
            color: rgba(255, 71, 87, 0.2);
            animation: floatUp 5s infinite linear;
            font-size: 20px;
            bottom: -20px;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes floatUp {
            to { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="envelope-wrapper" id="envelope" onclick="openEnvelope()">
        <div class="envelope-flap"></div>
        <div class="envelope-right"></div>
        
        <!-- Mektup İçeriği -->
        <div class="letter">
            <!-- Düzeltilmiş Fotoğraf Linkiniz -->
            <img class="father-photo" src="https://i.ibb.co/vYYS8JDv/Whats-App-Image-2026-11-01-at-15-21-34.jpg" alt="Canım Babam ve Ben">
            <h1>Canım Babam, İyi Ki Varsın!</h1>
            <p>Sen benim hayatımdaki en büyük şansımsın. Sana olan sevgimi bu kez kendi ellerimle yazdığım küçük bir kodla göstermek istedim. Her adımımda arkamda durduğun, bana her zaman güvendiğin için teşekkür ederim. Seni çok seviyorum!</p>
        </div>

        <div class="hint" id="hint-text">Mektubu açmak için tıkla ❤️</div>
    </div>

    <script>
        function openEnvelope() {
            const env = document.getElementById('envelope');
            const hint = document.getElementById('hint-text');
            env.classList.add('open');
            hint.style.display = 'none';
        }

        function createBgHeart() {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            document.body.appendChild(heart);

            setTimeout(() => { heart.remove(); }, 5000);
        }
        setInterval(createBgHeart, 400);
    </script>
</body>
</html>
